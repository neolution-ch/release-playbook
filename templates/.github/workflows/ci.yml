name: CI

on:
    pull_request:
        branches:
            - main
            - "release/**"

jobs:
    changeset-check:
        name: Changeset Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Install Dependencies
              run: npm ci

            # Only the Version Packages PR opened by the release bot skips the check, so a
            # contributor branch named changeset-release/... cannot bypass it.
            - name: Check for changesets
              if: "!(startsWith(github.head_ref, 'changeset-release/') && github.event.pull_request.user.login == 'csag-changesets-bot[bot]')"
              run: npx changeset status --since=origin/${{ github.base_ref }}
