name: CI

on:
    pull_request:
        branches:
            - main
            - "release/**"

jobs:
    changeset-check:
        name: Changeset Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: Install Dependencies
              run: npm ci

            - name: Check for changesets
              if: github.head_ref != 'changeset-release/main' && !startsWith(github.head_ref, 'changeset-release/release/')
              run: npx changeset status --since=origin/${{ github.base_ref }}
